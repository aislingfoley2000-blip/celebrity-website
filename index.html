<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notable Walks</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TOP HEADER -->
    <header class="header">

        <div class="brand">
            NOTABLE WALKS
        </div>

        <!-- SEARCH -->
        <div class="search-container">

            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="SEARCH"
                autocomplete="off"
            >

            <button
                id="clearSearch"
                class="clear-search"
                aria-label="Clear search"
            >
                ×
            </button>

        </div>

    </header>


    <!-- SIDE CATEGORY NAVIGATION -->
    <nav class="side-nav">

        <a href="#actors">ACTORS</a>
        <span>•</span>

        <a href="#singers">SINGERS</a>
        <span>•</span>

        <a href="#influencers">INFLUENCERS</a>
        <span>•</span>

        <a href="#models">MODELS</a>

    </nav>


    <!-- MAIN CONTENT -->
    <main class="page">

        <div class="date">
            AUG //26
        </div>


        <!-- SEARCH RESULTS MESSAGE -->
        <div id="searchMessage" class="search-message"></div>


        <!-- PHOTO COLLAGE -->
        <section class="collage" id="collage">

            <!-- DUA LIPA -->
            <div
                class="photo photo-1"
                data-person="Dua Lipa"
                data-category="Singer"
            >
                <img
                    src="images/dualipa.jpg"
                    alt="Dua Lipa"
                >
            </div>


            <!-- KENDALL JENNER -->
            <div
                class="photo photo-2"
                data-person="Kendall Jenner"
                data-category="Model"
            >
                <img
                    src="images/kendalljenner.jpg"
                    alt="Kendall Jenner"
                >
            </div>


            <!-- CONNOR STORRIE -->
            <div
                class="photo photo-3"
                data-person="Connor Storrie"
                data-category="Actor"
            >
                <img
                    src="images/connorstorrie.jpg"
                    alt="Connor Storrie"
                >
            </div>


            <!-- JENNIFER LAWRENCE -->
            <div
                class="photo photo-4"
                data-person="Jennifer Lawrence"
                data-category="Actor"
            >
                <img
                    src="images/jenniferlawrence.jpg"
                    alt="Jennifer Lawrence"
                >
            </div>


            <!-- JACOB ELORDI -->
            <div
                class="photo photo-5"
                data-person="Jacob Elordi"
                data-category="Actor"
            >
                <img
                    src="images/jacobelordi.jpg"
                    alt="Jacob Elordi"
                >
            </div>


            <!-- RIHANNA -->
            <div
                class="photo photo-6"
                data-person="Rihanna"
                data-category="Singer"
            >
                <img
                    src="images/rihanna.jpg"
                    alt="Rihanna"
                >
            </div>


            <!-- MARGOT ROBBIE -->
            <div
                class="photo photo-7"
                data-person="Margot Robbie"
                data-category="Actor"
            >
                <img
                    src="images/margotrobbie.jpg"
                    alt="Margot Robbie"
                >
            </div>


            <!-- HARRY STYLES -->
            <div
                class="photo photo-8"
                data-person="Harry Styles"
                data-category="Singer"
            >
                <img
                    src="images/harrystyles.jpg"
                    alt="Harry Styles"
                >
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
